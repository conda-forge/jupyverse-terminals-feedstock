schema_version: 1

context:
  version: "0.2.0"

package:
  name: jupyverse-terminals
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/j/jupyverse-terminals/jupyverse_terminals-${{ version }}.tar.gz
    sha256: fafe90154b456701b916caacef0ccb5f03594c8c8a69e3b12e333b23f1c50fc0

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.11.32,<0.12
  run:
    - python >=${{ python_min }}
    - fastapi-core
    - pydantic
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-auth >=0.2.0,<0.3.0

tests:
  - python:
      imports: jupyverse_terminals
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/api/terminals
  summary: The API for Jupyverse's terminals.

extra:
  recipe-maintainers:
    - davidbrochart
